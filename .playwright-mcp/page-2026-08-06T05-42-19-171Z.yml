    - heading "두 개의 축 — 결과 vs 검증방법" [level=2] [ref=f5e77]
    - generic [ref=f5e78]: "결과(Pass/Fail/N·T) = 테스트가 통과했는가. 검증방법(🤖자동/✋수동) = 누가 확인했는가. 서로 독립이라 조합이 가능합니다 — 예: Pass + 🤖자동(Playwright가 통과 확인) vs Pass + ✋수동(QA가 직접 통과 확인). 나중에 “이거 누가 확인한 거지?”가 한눈에 구분됩니다. · N·T = 아직 안 함/보류(Not Tested)"
    - heading "사용법" [level=2] [ref=f5e79]
    - list [ref=f5e80]:
      - listitem [ref=f5e81]: 각 TC의 [Pass][Fail][N·T] 클릭·비고 입력 → 자동 저장
      - listitem [ref=f5e82]: 검증방법 버튼(🤖 자동 / ✋ 수동)으로 '누가 확인했는지' 표시 — Playwright 자동확인분은 🤖로 미리 표기됨(클릭하면 —→✋→🤖 순환)
      - listitem [ref=f5e83]: "필터: 자동확인 / 수동확인 / 미확인 / 자동화 가능·불가 / Fail만 / 미실행만 으로 골라보기"
      - listitem [ref=f5e84]: 상단 [결과 내보내기(CSV)] 백업·공유(TC ID·결과·검증방법·비고 포함), [결과 불러오기(CSV)] 복원, [초기화] Pass/Fail 리셋(비고는 유지)
      - listitem [ref=f5e85]: 공유는 serve_dashboard.py 로 dashboard.html 을 띄우면 결과·비고·검증방법이 서버에 저장돼 여러 명이 공유(단독 report.html은 브라우저에 저장)