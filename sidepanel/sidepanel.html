<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- 화이트 테마 전용 — 크롬이 다크여도 첫 페인트부터 라이트로 -->
  <meta name="color-scheme" content="light" />
  <title>딸깍 버그리포팅</title>
  <!-- 본문 한글 폰트. CDN은 MV3 CSP에 막혀서 패키지 안에 벤더링했다. -->
  <link rel="stylesheet" href="../fonts/wanted-sans/wanted-sans.css" />
  <link rel="stylesheet" href="sidepanel.css" />
</head>
<body>
  <header class="header">
    <div class="brand">
      <span class="brand-dot" aria-hidden="true"></span>
      <span class="brand-name">딸깍 버그리포팅</span>
    </div>
    <button id="open-options" class="icon-btn" title="설정" aria-label="설정">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
    </button>
  </header>

  <!-- ===== 뷰 1: 런처 (캡처 시작) ===== -->
  <main id="view-launcher" class="view">
    <p class="section-label">
      LIVE
      <span class="section-rule" aria-hidden="true"></span>
      <span id="live-state" class="live-state">
        <span class="live-dot" aria-hidden="true"></span>
        <span id="live-label">따라가는 중</span>
      </span>
    </p>

    <!-- 현재 탭 화면을 주기적으로 다시 찍어 보여준다. 눌러도 '화면 캡처'와 같다. -->
    <button id="live-preview" class="live-preview" type="button" title="이 화면을 캡처">
      <img id="live-img" class="live-img" alt="현재 탭 미리보기" hidden />
      <span id="live-empty" class="live-empty">미리보기를 불러오는 중…</span>
    </button>

    <p class="section-label">
      CAPTURE
      <span class="section-rule" aria-hidden="true"></span>
      <span class="section-count">4</span>
    </p>

    <div class="launcher-group">
      <div class="actions">
        <button class="action-btn" data-action="visible" type="button">
          <span class="ico" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
              <circle cx="12" cy="13" r="4"></circle>
            </svg>
          </span>
          <span class="label">화면 캡처</span>
          <span class="sub">보이는 영역</span>
        </button>

        <button class="action-btn" data-action="fullpage" type="button">
          <span class="ico" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <rect x="4" y="2" width="16" height="20"></rect>
              <path d="M8 7h8M8 12h8M8 17h5"></path>
            </svg>
          </span>
          <span class="label">전체 페이지</span>
          <span class="sub">스크롤 캡처</span>
        </button>

        <button class="action-btn" data-action="region" type="button">
          <span class="ico" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"></path>
            </svg>
          </span>
          <span class="label">영역 선택</span>
          <span class="sub">드래그 영역</span>
        </button>

        <!-- REC 링+닷. 카메라 아이콘은 '화면 캡처'와 헷갈려서 교체. -->
        <button class="action-btn" data-action="video" type="button">
          <span class="ico" aria-hidden="true">
            <svg viewBox="0 0 20 20" fill="none">
              <circle cx="10" cy="10" r="8.4" stroke="currentColor" stroke-width="1.2"></circle>
              <circle cx="10" cy="10" r="4" fill="currentColor"></circle>
            </svg>
          </span>
          <span class="label">영상 녹화</span>
          <span class="sub">전체 · 영역 선택</span>
        </button>
      </div>
    </div>

    <div id="recording-banner" class="recording-banner" hidden>
      <span class="rec-dot" aria-hidden="true"></span>
      <span>녹화 중</span>
      <span id="rec-time" class="rec-time">00:00</span>
      <button id="rec-stop" class="rec-stop" type="button">
        <svg viewBox="0 0 24 24" width="10" height="10" fill="currentColor" aria-hidden="true">
          <rect x="6" y="6" width="12" height="12"></rect>
        </svg>
        중지
      </button>
    </div>

    <p id="launcher-status" class="inline-status" role="status" hidden></p>

    <div id="config-warning" class="config-warning" hidden>
      ClickUp 토큰/리스트가 설정되지 않았습니다.
      <button id="open-options-link" class="link-btn" type="button">설정하기</button>
    </div>

    <p class="section-label">
      DIAGNOSTICS
      <span class="section-rule" aria-hidden="true"></span>
      <button id="collect-reread" class="collect-refresh" type="button" title="다시 읽기(새로고침 없이)" aria-label="다시 읽기">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12a9 9 0 1 1-2.6-6.4"></path>
          <path d="M21 3v6h-6"></path>
        </svg>
      </button>
    </p>

    <section id="collect-card" class="collect-card">
      <div class="collect-head">
        <span class="collect-title">이 페이지 진단</span>
      </div>
      <div class="collect-sub">개발자 디버깅용 정보를 자동으로 모아 리포트에 첨부해요</div>
      <div id="collect-summary" class="collect-summary"><span class="collect-msg">불러오는 중…</span></div>
      <ul id="collect-detail" class="collect-detail" hidden></ul>
      <div class="collect-foot">
        <label class="collect-toggle">
          <input type="checkbox" id="auto-collect" checked />
          리포트에 자동 첨부
        </label>
        <span class="collect-actions">
          <button id="collect-refresh" class="collect-btn" type="button" title="캐시를 무시하고 새로고침한 뒤 다시 진단합니다">강력 새로고침</button>
        </span>
      </div>
    </section>

    <p class="section-label">
      ENVIRONMENT
      <span class="section-rule" aria-hidden="true"></span>
      <span class="section-meta">리포트와 함께 첨부</span>
    </p>

    <div class="env-card">
      <div class="env-row"><span>URL</span><span id="env-url">—</span></div>
      <div class="env-row"><span>브라우저</span><span id="env-ua">—</span></div>
      <div class="env-row"><span>화면</span><span id="env-screen" class="env-num">—</span></div>
      <div class="env-row"><span>시각</span><span id="env-clock" class="env-num">—</span></div>
    </div>
  </main>

  <!-- ===== 뷰 2: 리포트 (미리보기 + 폼) ===== -->
  <main id="view-report" class="view" hidden>
    <button id="back-btn" class="back-btn" type="button">
      <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M15 18l-6-6 6-6"></path>
      </svg>
      새 캡처
    </button>

    <div class="annotate-toolbar" role="toolbar" aria-label="주석 도구">
      <div class="tool-group">
        <button class="tool-btn" data-tool="arrow" title="화살표" aria-label="화살표">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M7 17 17 7"></path><path d="M9 7h8v8"></path>
          </svg>
        </button>
        <button class="tool-btn" data-tool="highlight" title="형광펜" aria-label="형광펜">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 21h18"></path><path d="M15.5 3.5a2.1 2.1 0 0 1 3 3L9 16l-4 1 1-4z"></path>
          </svg>
        </button>
        <button class="tool-btn" data-tool="step" title="단계 번호" aria-label="단계 번호">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9"></circle><path d="M10.5 9.5 12.5 8.5V16"></path>
          </svg>
        </button>
        <button class="tool-btn" data-tool="text" title="텍스트" aria-label="텍스트">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 6V4h14v2"></path><path d="M12 4v16"></path><path d="M9 20h6"></path>
          </svg>
        </button>
      </div>

      <div class="tool-group colors">
        <button class="color-btn c-red" data-color="#e5484d" title="빨강" aria-label="빨강"></button>
        <button class="color-btn c-amber" data-color="#e0940b" title="주황" aria-label="주황"></button>
        <button class="color-btn c-blue" data-color="#2b6cb0" title="파랑" aria-label="파랑"></button>
      </div>

      <div class="tool-group trailing">
        <button id="undo-btn" class="tool-btn" title="실행 취소" aria-label="실행 취소">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 14 4 9l5-5"></path><path d="M4 9h10a6 6 0 0 1 0 12h-2"></path>
          </svg>
        </button>
        <button id="clear-btn" class="tool-btn" title="전체 지우기" aria-label="전체 지우기">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 6h18"></path><path d="M9 6V4h6v2"></path><path d="M18.5 6 17.5 20h-11L5.5 6"></path>
          </svg>
        </button>
      </div>
    </div>

    <div class="preview-wrap">
      <div class="preview">
        <canvas id="annotate-canvas" class="annotate-canvas"></canvas>
        <!-- controlsList=nofullscreen: 사이드 패널은 Fullscreen API가 막혀 있어
           네이티브 전체화면 버튼이 눌러도 아무 일이 없다. 죽은 버튼을 지우고
           아래 '새 탭에서 크게 보기'로 유도한다. -->
      <video id="video-preview" class="video-preview" controls controlsList="nofullscreen" hidden></video>
      </div>
      <!-- 화면 따라가기 on/off. 주석을 그리기 시작하면 자동으로 고정으로 넘어간다. -->
      <button id="follow-btn" class="follow-btn" type="button" title="화면 따라가기 켜기/끄기">
        <span class="live-dot" aria-hidden="true"></span>
        <span id="follow-label">따라가는 중</span>
      </button>
      <button id="zoom-btn" class="zoom-btn" type="button" title="크게 보기" aria-label="크게 보기" hidden>
        <svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M15 3h6v6"></path><path d="M9 21H3v-6"></path><path d="M21 3l-7 7"></path><path d="M3 21l7-7"></path>
        </svg>
        크게
      </button>
    </div>

    <div id="video-actions" class="video-actions" hidden>
      <button id="video-play-btn" class="video-play-btn" type="button">▶ 재생</button>
      <!-- 전체화면을 쓰려면 패널 바깥이어야 한다. 여기가 사실상 유일한 경로라 주버튼으로. -->
      <button id="video-open-btn" class="video-open-btn" type="button">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M15 3h6v6"></path><path d="M10 14 21 3"></path>
          <path d="M21 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5"></path>
        </svg>
        새 탭에서 크게 보기
      </button>
    </div>

    <p class="section-label">
      REPORT
      <span class="section-rule" aria-hidden="true"></span>
    </p>

    <label class="field">
      <span class="field-label">제목 <em>*</em></span>
      <input id="task-title" type="text" placeholder="[고객사] 이슈 내용" maxlength="255" />
    </label>

    <label class="field">
      <span class="field-label">우선순위</span>
      <select id="task-priority">
        <option value="1">긴급 (Urgent)</option>
        <option value="2">높음 (High)</option>
        <option value="3" selected>보통 (Normal)</option>
        <option value="4">낮음 (Low)</option>
      </select>
    </label>

    <label class="field">
      <span class="field-label">
        설명 / 재현 단계
        <span id="desc-meta" class="opt" style="margin-left:auto" hidden></span>
      </span>
      <textarea id="task-description" placeholder="재현 단계와 환경 정보를 적어주세요."></textarea>
    </label>

    <label class="field">
      <span class="field-label">멘션 표시 <span class="opt">· 본문 맨 아래에 하이퍼링크</span></span>
      <input id="mention-name" type="text" placeholder="예: 홍길동 / OO팀 / OO그룹" />
    </label>

    <div id="target-info" class="target-info" hidden></div>

    <div class="form-actions">
      <button id="submit-btn" class="primary-btn" type="button">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M5 12l5 5L20 7"></path>
        </svg>
        <span class="btn-text">그대로 ClickUp에 등록</span>
        <span class="spinner" hidden aria-hidden="true"></span>
      </button>

      <button id="ai-submit-btn" class="ai-btn" type="button">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 3v4M12 17v4M3 12h4M17 12h4"></path>
          <path d="M8.5 8.5 6 6M15.5 8.5 18 6M8.5 15.5 6 18M15.5 15.5 18 18"></path>
        </svg>
        <span class="ai-btn-text">AI로 다듬어 등록</span>
        <span class="spinner ai-spinner" hidden aria-hidden="true"></span>
      </button>
    </div>

    <div id="toast" class="toast" hidden>
      <span id="toast-msg"></span>
      <a id="toast-link" href="#" target="_blank" rel="noopener" hidden>태스크 열기 →</a>
    </div>
  </main>

  <script type="module" src="sidepanel.js"></script>
</body>
</html>
