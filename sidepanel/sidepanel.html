<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>딸깍 버그리포팅</title>
  <link rel="stylesheet" href="sidepanel.css" />
</head>
<body>
  <header class="header">
    <div class="brand">
      <span class="brand-dot" aria-hidden="true"></span>
      <span class="brand-name">딸깍 버그리포팅</span>
    </div>
    <button id="open-options" class="icon-btn" title="설정" aria-label="설정">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
    </button>
  </header>

  <!-- ===== 뷰 1: 런처 (캡처 시작) ===== -->
  <main id="view-launcher" class="view">
    <div class="actions">
      <button class="action-btn" data-action="visible" type="button">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
          <circle cx="12" cy="13" r="4"></circle>
        </svg>
        <span class="label">화면 캡처</span>
        <span class="sub">보이는 영역</span>
      </button>

      <button class="action-btn" data-action="fullpage" type="button">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="2" width="16" height="20" rx="2"></rect>
          <path d="M8 7h8M8 12h8M8 17h5"></path>
        </svg>
        <span class="label">전체 페이지</span>
        <span class="sub">스크롤 캡처</span>
      </button>

      <button class="action-btn" data-action="region" type="button">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"></path>
        </svg>
        <span class="label">영역 선택</span>
        <span class="sub">드래그 영역</span>
      </button>

      <button class="action-btn" data-action="video" type="button" disabled>
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="23 7 16 12 23 17 23 7"></polygon>
          <rect x="1" y="5" width="15" height="14" rx="2"></rect>
        </svg>
        <span class="label">영상 녹화</span>
        <span class="badge">곧 지원</span>
      </button>
    </div>

    <p id="launcher-status" class="inline-status" role="status" hidden></p>

    <div id="config-warning" class="config-warning" hidden>
      ⚠️ ClickUp 토큰/리스트가 설정되지 않았습니다.
      <button id="open-options-link" class="link-btn" type="button">설정하기</button>
    </div>
  </main>

  <!-- ===== 뷰 2: 리포트 (미리보기 + 폼) ===== -->
  <main id="view-report" class="view" hidden>
    <button id="back-btn" class="back-btn" type="button">← 새 캡처</button>

    <div class="annotate-toolbar" role="toolbar" aria-label="주석 도구">
      <button class="tool-btn" data-tool="arrow" title="화살표" aria-label="화살표">↗</button>
      <button class="tool-btn" data-tool="highlight" title="형광펜" aria-label="형광펜">▭</button>
      <button class="tool-btn" data-tool="step" title="단계 번호" aria-label="단계 번호">①</button>
      <button class="tool-btn" data-tool="text" title="텍스트" aria-label="텍스트">T</button>
      <span class="tool-sep"></span>
      <button class="color-btn c-red" data-color="#e11d48" title="빨강" aria-label="빨강"></button>
      <button class="color-btn c-amber" data-color="#f59e0b" title="주황" aria-label="주황"></button>
      <button class="color-btn c-blue" data-color="#2563eb" title="파랑" aria-label="파랑"></button>
      <span class="tool-sep"></span>
      <button id="undo-btn" class="tool-btn" title="실행 취소" aria-label="실행 취소">↶</button>
      <button id="clear-btn" class="tool-btn" title="전체 지우기" aria-label="전체 지우기">🗑</button>
    </div>

    <div class="preview">
      <canvas id="annotate-canvas" class="annotate-canvas"></canvas>
    </div>

    <label class="field">
      <span class="field-label">제목 <em>*</em></span>
      <input id="task-title" type="text" placeholder="버그 요약" maxlength="255" />
    </label>

    <label class="field">
      <span class="field-label">우선순위</span>
      <select id="task-priority">
        <option value="1">🔴 긴급 (Urgent)</option>
        <option value="2">🟠 높음 (High)</option>
        <option value="3" selected>🟡 보통 (Normal)</option>
        <option value="4">⚪ 낮음 (Low)</option>
      </select>
    </label>

    <label class="field">
      <span class="field-label">설명 / 재현 단계</span>
      <textarea id="task-description" placeholder="재현 단계와 환경 정보를 적어주세요."></textarea>
    </label>

    <div id="target-info" class="target-info" hidden></div>

    <button id="submit-btn" class="primary-btn" type="button">
      <span class="btn-text">ClickUp에 등록</span>
      <span class="spinner" hidden aria-hidden="true"></span>
    </button>

    <div id="toast" class="toast" hidden>
      <span id="toast-msg"></span>
      <a id="toast-link" href="#" target="_blank" rel="noopener" hidden>태스크 열기 →</a>
    </div>
  </main>

  <script type="module" src="sidepanel.js"></script>
</body>
</html>
